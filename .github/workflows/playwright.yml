name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  playwright-tests:
    runs-on: ubuntu-latest

    strategy:    # for sharding purpose
      matrix:
        shard : [1,2,3,4]   #tell github to create 4 parallel job
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4 
        with:
          node-version: 20
     
      - name: Install dependencies
        run: npm install
      
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # - name: Run Playwright tests # to run tests in particular browsers
      #   run: npx playwright test tests --project=chromium

      - name: Run Playwright tests (shard ${{matrix.shard}}) # for sharding purpose
        run: npx playwright test --shard ${{matrix.shard}}/4

      # - name: Run Smoke tests => To run smoke or sanity regression
      #   run: npx playwright test tests/Smoke   # tests/Smoke => tests folder and Smoke is folder
 
      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
         name: playwright-report
         path: playwright-report/
